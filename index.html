    <!-- Instant Theme Detection Script -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          if (savedTheme === 'light' || (!savedTheme && prefersLight)) {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#faf9f6] text-slate-800 dark:bg-[#0e1117] dark:text-slate-100 font-sans antialiased selection:bg-teal-500/20 selection:text-teal-700 dark:selection:text-teal-300">
